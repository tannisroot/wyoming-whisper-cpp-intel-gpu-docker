services:
  whisper-cpp:
    build:
      context: ./whisper-cpp
      args:
        - WHISPER_CPP_VERSION=${WHISPER_CPP_VERSION}
    restart: unless-stopped
    depends_on:
      model-download:
        condition: service_completed_successfully
    # Change user to the one that will run the container
    user: 1000:1000
    group_add:
      # Change this number to match your "render" host group id
      # You can get the id number by running: getent group render
      - "107"
    security_opt:
      - no-new-privileges
    volumes:
      - type: volume
        source: models
        target: /models
    networks:
      whisper:
    hostname: whispercpp
    devices:
      - /dev/dri:/dev/dri
    environment:
      - SYCL_CACHE_PERSISTENT=1
      - SYCL_CACHE_DIR=/models/sycl_cache
      - SYCL_DEVICE_ALLOWLIST=BackendName:level_zero
    command: |
      build/bin/whisper-server
      -l ${WHISPER_LANG}
      -bs ${WHISPER_BEAM_SIZE}
      -m /models/ggml-${WHISPER_MODEL}.bin
      --host 0.0.0.0
      --port 8910
      --suppress-nst
      --prompt "${WHISPER_PROMPT}"
  wyoming-api:
    build:
      context: ./wyoming-api
    restart: unless-stopped
    depends_on:
      whisper-cpp:
        condition: service_started
    security_opt:
      - no-new-privileges
    # Change user to the one that will run the container
    user: 1000:1000
    networks:
      whisper:
    ports:
      - 7891:7891
    command: script/run --uri tcp://0.0.0.0:7891 --api http://whispercpp:8910/inference
  model-download:
    security_opt:
      - no-new-privileges
    user: 1000:1000
    build:
      context: ./model-download
      args:
        - WHISPER_CPP_VERSION=${WHISPER_CPP_VERSION}
    volumes:
      - type: volume
        source: models
        target: /models
    restart: no
    networks:
      whisper:
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL}
networks:
  whisper:
volumes:
  models:
